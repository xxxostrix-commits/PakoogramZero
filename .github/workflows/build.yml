name: Build Pakoogram Zero APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PakoogramZero.apk

      - name: Publish raw APK to GitHub Releases (no ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pakoogram Zero (Latest)
          body: |
            РђРІС‚РѕРјР°С‚РёС‡РµСЃРєР°СЏ СЃР±РѕСЂРєР° #${{ github.run_number }}
            РљРѕРјРјРёС‚: ${{ github.event.head_commit.message }}
          files: PakoogramZero.apk
          make_latest: true

      - name: Send APK directly to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUM: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@PakoogramZero.apk" \
              -F "caption=Pakoogram Zero #${RUN_NUM}: ${COMMIT_MSG}" > /dev/null
            echo "APK sent to Telegram!"
          else
            echo "Telegram secrets not configured yet, skipping bot upload."
          fi